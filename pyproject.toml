[project]
name = "orwick"
version = "0.1.0"
description = "Clean AI agent runtime with layered safety controls"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
orwick = "agent_core.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_core = ["tools/builtin/*/tool.json", "skills_builtin/*/SKILL.md", "skills_builtin/*/ui.json", "skills_builtin/*/contract.json"]  # built-in tools and skills ship with Orwick

[tool.pytest.ini_options]
testpaths = ["tests"]
